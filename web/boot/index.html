<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MiniMath</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      .box { text-align: center; max-width: 520px; padding: 24px; }
      .logo { width: 64px; height: 64px; border-radius: 14px; background: #1f5fd1; color: #fff; display: inline-grid; place-items: center; font-size: 26px; font-style: italic; }
      #error { color: #b42318; white-space: pre-wrap; text-align: left; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">√x</div>
      <p id="message">Starting MiniMath…</p>
      <p id="error" hidden></p>
    </div>
    <script>
      // Called by the Rust shell if the local server cannot be started.
      window.showStartupError = (text) => {
        document.getElementById("message").textContent = "MiniMath could not start.";
        const error = document.getElementById("error");
        error.hidden = false;
        error.textContent = text;
      };
    </script>
  </body>
</html>
